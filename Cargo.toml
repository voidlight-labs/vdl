[package]
name = "vdl"
version = "0.1.0"
edition = "2021"
authors = ["Khayren <khayren@voidlight.io>"]
description = "Voidlight Definition Language compiler"
license = "MIT"
repository = "https://github.com/voidlight-labs/vdl"

[[bin]]
name = "vdl"
path = "src/main.rs"

[lib]
name = "vdl"
path = "src/lib.rs"

[dependencies]
chumsky = "0.9"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.2", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.10"
