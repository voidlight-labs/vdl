name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: vdl-x86_64-linux-musl.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: vdl-aarch64-macos.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: vdl-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/vdl package/
          cp README.md LICENSE package/ 2>/dev/null || cp README.md package/
          tar -czf ${{ matrix.archive }} -C package .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/${{ matrix.target }}/release/vdl.exe package/
          Copy-Item README.md package/
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Attach archives to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: archives
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          generate_release_notes: true
